# Pull request CI: code style and the test suite.
#
# The repository's existing pr-quality.yaml only checks PR metadata (title,
# description, target branch). Nothing ran Pint or the tests, so a PR could be
# merged without either ever being executed. This fills that gap.
#
# No service containers are needed: phpunit.xml forces DB_CONNECTION=testing,
# which config/database.php maps to sqlite :memory:, and CACHE_DRIVER=array.
name: CI - Pull request

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"

jobs:
  pint:
    name: Code style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Needed for the merge-base diff below.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-interaction --no-progress"

      # Scoped to the files this change actually touches.
      #
      # `pint --test` over the whole repository fails: roughly forty
      # pre-existing files violate fully_qualified_strict_types and friends.
      # Gating on that would block every PR on debt it did not create, so this
      # asserts only that new and modified files are clean.
      #
      # --test reports violations without rewriting files, so CI never pushes
      # style changes back. Run `vendor/bin/pint --dirty` locally to fix.
      - name: Check formatting of changed files
        run: |
          set -euo pipefail

          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE="$(git rev-parse HEAD~1)"
          fi

          CHANGED="$(git diff --name-only --diff-filter=ACMR "${BASE}...HEAD" -- '*.php' || true)"

          if [ -z "${CHANGED}" ]; then
            echo "No PHP files changed."
            exit 0
          fi

          echo "Checking:"
          echo "${CHANGED}" | sed 's/^/  /'
          echo "${CHANGED}" | xargs vendor/bin/pint --test

  # ---------------------------------------------------------------------------
  # SCOPED, AND DELIBERATELY SO. READ THIS BEFORE TRUSTING A GREEN TICK.
  #
  # This job does NOT run the full test suite. Running `--testsuite=Unit` and
  # `--testsuite=Feature` on this repository produces roughly 717 failures out
  # of 8,286 tests, and every one of them pre-dates this workflow. The dominant
  # cause is `Target class [config] does not exist`: tests under tests/Unit need
  # `uses(TestCase::class)` declared per file, because tests/Pest.php applies it
  # only to Feature, v4 and v5.
  #
  # Gating merges on a suite that has never been green would mean either
  # blocking every PR or teaching everyone to ignore a red tick. Instead this
  # runs the suites that do pass, so a failure here is a real regression.
  #
  # A green tick therefore means "the covered suites pass", NOT "the test suite
  # passes". Widen `suite` below as the pre-existing failures get fixed.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Browser suites are excluded separately: tests/Browser is legacy and
        # tests/v4/Browser needs a Playwright download and a headless Chromium,
        # which belongs in its own workflow rather than gating every PR.
        include:
          - suite: Infisical
            paths: tests/Unit/InfisicalPathTest.php tests/Feature/InfisicalAuthorizationTest.php tests/Feature/InfisicalClientTest.php tests/Feature/InfisicalInjectionTest.php tests/Feature/InfisicalLockTest.php tests/Feature/InfisicalModelTest.php tests/Feature/InfisicalSettingsTest.php tests/Feature/InfisicalSharedVariablesScreenTest.php tests/Feature/InfisicalSystemWritesTest.php
          - suite: Notifications
            paths: tests/Unit/SendMessageToMicrosoftTeamsJobTest.php
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          # pdo_sqlite backs the in-memory test database; sockets is required
          # by the app and is not enabled by default.
          extensions: pdo_sqlite, sqlite3, sockets, bcmath, intl, zip
          # Pest forks a process per test file and the child does not inherit
          # an -d flag, so the limit has to be set in the ini.
          ini-values: memory_limit=-1
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          composer-options: "--prefer-dist --no-interaction --no-progress"

      - name: Prepare environment
        run: |
          cp .env.example .env 2>/dev/null || cp .env.development.example .env
          php artisan key:generate --no-interaction

      - name: Run ${{ matrix.suite }} tests
        run: php artisan test ${{ matrix.paths }} --compact
